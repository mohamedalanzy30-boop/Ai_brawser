name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch ONNX Runtime Web + model into app assets
        run: |
          set -e
          cd android/app/src/main/assets
          mkdir -p ort model
          npm pack onnxruntime-web@1.31.1 --silent
          tar -xzf onnxruntime-web-*.tgz package/dist
          cp package/dist/ort.webgpu.min.js ort/
          # the WebGPU bundle only loads the asyncify build; the other three variants were 60 MB of dead weight
          cp package/dist/ort-wasm-simd-threaded.asyncify.mjs package/dist/ort-wasm-simd-threaded.asyncify.wasm ort/
          rm -rf package onnxruntime-web-*.tgz
          curl -fL -o model/realesr-general-x4v3.onnx \
            https://huggingface.co/CoderViking/realesr-general-x4v3-onnx/resolve/main/realesr-general-x4v3.onnx
          # fixed-size copy of the SR model for the NPU (native player)
          pip install --quiet --only-binary=:all: onnx
          python3 "$GITHUB_WORKSPACE/tools/fix_model.py" model/realesr-general-x4v3.onnx model/realesr-x4v3-640x360.onnx 360 640
          # A16W8 quantized copy for the NPU, calibrated on real video frames (Big Buck Bunny, CC-BY Blender Foundation; first mirror that answers).
          # Optional: if anything here fails the app simply uses the float model.
          ( pip install --quiet --only-binary=:all: onnxruntime imageio-ffmpeg &&
            FFMPEG=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") &&
            for SRC in https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4 \
                       https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_5MB.mp4 \
                       https://download.blender.org/peach/bigbuckbunny_movies/big_buck_bunny_480p_h264.mov; do
              "$FFMPEG" -loglevel error -y -i "$SRC" -t 600 \
                -vf "select='not(mod(n\,300))',scale=640:360:flags=bicubic" -fps_mode vfr -frames:v 24 -f rawvideo -pix_fmt rgb24 "$RUNNER_TEMP/calib.rgb" \
                && [ -s "$RUNNER_TEMP/calib.rgb" ] && echo "calibration frames from $SRC" && break
            done && [ -s "$RUNNER_TEMP/calib.rgb" ] &&
            python3 "$GITHUB_WORKSPACE/tools/quantize_qnn.py" model/realesr-x4v3-640x360.onnx "$RUNNER_TEMP/calib.rgb" model/realesr-x4v3-640x360-a16w8.onnx &&
            rm -f model/*.pre.onnx ) || echo "::warning::quantized model skipped"
          # ad/tracker host list (StevenBlack/hosts, MIT), bundled so blocking needs no network at runtime
          # + HaGeZi Pro (GPL-3.0): covers the pop-under / redirect ad networks used by movie sites
          { curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts \
              | awk '$1=="0.0.0.0" && $2!="0.0.0.0" {print tolower($2)}'
            curl -fsSL https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt \
              | grep -v '^#' | tr 'A-Z' 'a-z'; } | grep -E '^[a-z0-9.-]+$' | sort -u > adhosts.txt
          test "$(wc -l < adhosts.txt)" -gt 10000
          # optional adult-content filter (off by default in the app): HaGeZi NSFW (GPL-3.0)
          curl -fsSL https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nsfw-onlydomains.txt \
            | grep -v '^#' | tr 'A-Z' 'a-z' | grep -E '^[a-z0-9.-]+$' | sort -u > adulthosts.txt \
            || { echo "::warning::adult list skipped"; : > adulthosts.txt; }
          ls -la ort model adhosts.txt adulthosts.txt
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -Pvc=${{ github.run_number }}
      - name: Stage APK (outside the workspace; its path contains '..')
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/ai-browser-debug.apk"
          ls -la "$RUNNER_TEMP/apk"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ai-browser-debug-apk
          path: ${{ runner.temp }}/apk/ai-browser-debug.apk
      # pushes only check that the app builds; the phone download is updated only when Basil asks
      # (Actions -> Build Android APK -> Run workflow)
      - name: Publish APK as a release (direct download from the phone)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest "$RUNNER_TEMP/apk/ai-browser-debug.apk" --repo "$GITHUB_REPOSITORY" \
            --title "AI Browser (debug APK)" --notes "Debug build for Android. Install and allow unknown sources." --prerelease
