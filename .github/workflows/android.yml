name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'engine-tests/**', '.github/workflows/android.yml']
  workflow_dispatch:
# read-only by default; only the release job below gets write access
permissions:
  contents: read
concurrency:
  group: apk-build
  cancel-in-progress: false
jobs:
  # in-page engine tests (engine.js) in headless Chromium, see engine-tests/
  engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Install test dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run engine tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Fetch ONNX Runtime Web + model into app assets
        run: |
          set -e
          cd android/app/src/main/assets
          mkdir -p ort model
          npm pack onnxruntime-web@1.31.1 --silent
          tar -xzf onnxruntime-web-*.tgz package/dist
          cp package/dist/ort.webgpu.min.js ort/
          # the WebGPU bundle only loads the asyncify build; the other three variants were 60 MB of dead weight
          cp package/dist/ort-wasm-simd-threaded.asyncify.mjs package/dist/ort-wasm-simd-threaded.asyncify.wasm ort/
          rm -rf package onnxruntime-web-*.tgz
          # SR model from Hugging Face, checked against the sha256 of the copy every released APK so far has shipped
          # (read from the APK's assets/model/realesr-general-x4v3.onnx, 4866417 bytes): if the file on Hugging Face
          # ever changes, the build stops instead of silently shipping a different model. MODEL_REV can be set to the
          # commit the run page prints as a notice (x-repo-commit); 'main' is safe while the checksum is checked.
          MODEL_REV=main
          MODEL_SHA256=1940a93ee08283a0a7286183186357b1688fe9fa8ede74604b424586aaddf112
          curl -fL -D "$RUNNER_TEMP/model.headers" -o model/realesr-general-x4v3.onnx \
            "https://huggingface.co/CoderViking/realesr-general-x4v3-onnx/resolve/$MODEL_REV/realesr-general-x4v3.onnx"
          MODEL_COMMIT=$(grep -i '^x-repo-commit:' "$RUNNER_TEMP/model.headers" | head -n1 | cut -d' ' -f2 | tr -d '\r' || true)
          echo "::notice::SR model commit ${MODEL_COMMIT:-unknown}, sha256 $(sha256sum model/realesr-general-x4v3.onnx | cut -d' ' -f1)"
          if [ -n "$MODEL_SHA256" ]; then
            echo "$MODEL_SHA256  model/realesr-general-x4v3.onnx" | sha256sum -c -
          else
            echo "::warning::SR model checksum not pinned yet (MODEL_SHA256 in android.yml)"
          fi
          # fixed-size copies of the SR model for the NPU (native player), one per source class (360p..660p);
          # each takes the video at its own size and returns 2560x1440 (the NPU scales the 4x result to the screen)
          pip install --quiet --only-binary=:all: onnx pillow
          SIZES="640x360 854x480 960x540 1174x660"
          for S in $SIZES; do W=${S%x*}; H=${S#*x}
            python3 "$GITHUB_WORKSPACE/tools/fix_model.py" model/realesr-general-x4v3.onnx model/realesr-x4v3-$S.onnx $H $W 1440 2560; done
          # A16W8 quantized copies for the NPU, calibrated on real video frames (Big Buck Bunny, CC-BY Blender Foundation; first mirror that answers).
          # Optional: if anything here fails the app simply uses the float models.
          ( pip install --quiet --only-binary=:all: onnxruntime==1.29.0 imageio-ffmpeg &&  # 1.29 has the calibration cache quantize_qnn.py uses
            FFMPEG=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") &&
            for SRC in https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4 \
                       https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_5MB.mp4 \
                       https://download.blender.org/peach/bigbuckbunny_movies/big_buck_bunny_480p_h264.mov; do
              "$FFMPEG" -loglevel error -y -i "$SRC" -t 600 \
                -vf "select='not(mod(n\,10))',scale=640:360:flags=bicubic" -fps_mode vfr -frames:v 24 -f rawvideo -pix_fmt rgb24 "$RUNNER_TEMP/calib.rgb" \
                && [ -s "$RUNNER_TEMP/calib.rgb" ] && echo "calibration frames from $SRC" && break
            done && [ -s "$RUNNER_TEMP/calib.rgb" ] &&
            for S in $SIZES; do
              python3 "$GITHUB_WORKSPACE/tools/quantize_qnn.py" model/realesr-x4v3-$S.onnx "$RUNNER_TEMP/calib.rgb" model/realesr-x4v3-$S-a16w8.onnx 640x360 || exit 1; done &&
            rm -f model/*.pre.onnx ) || { echo "::warning::quantized models skipped"; rm -f model/*-a16w8.onnx model/*.pre.onnx; }
          # ad/tracker host list (StevenBlack/hosts, MIT), bundled so blocking needs no network at runtime
          # + HaGeZi Pro (GPL-3.0): covers the pop-under / redirect ad networks used by movie sites
          { curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts \
              | awk '$1=="0.0.0.0" && $2!="0.0.0.0" {print tolower($2)}'
            curl -fsSL https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt \
              | grep -v '^#' | tr 'A-Z' 'a-z'; } | grep -E '^[a-z0-9.-]+$' | sort -u > adhosts.txt
          test "$(wc -l < adhosts.txt)" -gt 10000
          # optional adult-content filter (off by default in the app): HaGeZi NSFW (GPL-3.0)
          curl -fsSL https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nsfw-onlydomains.txt \
            | grep -v '^#' | tr 'A-Z' 'a-z' | grep -E '^[a-z0-9.-]+$' | sort -u > adulthosts.txt \
            || { echo "::warning::adult list skipped"; : > adulthosts.txt; }
          ls -la ort model adhosts.txt adulthosts.txt
      # optional private signing key from repo secrets; without AIB_KEYSTORE_BASE64 the committed debug.keystore is used
      # (see signingConfigs in android/app/build.gradle.kts: switching keys means one uninstall on the phone)
      - name: Use private signing key (if configured)
        env:
          AIB_KEYSTORE_BASE64: ${{ secrets.AIB_KEYSTORE_BASE64 }}
          AIB_KEYSTORE_PASSWORD: ${{ secrets.AIB_KEYSTORE_PASSWORD }}
          AIB_KEY_ALIAS: ${{ secrets.AIB_KEY_ALIAS }}
          AIB_KEY_PASSWORD: ${{ secrets.AIB_KEY_PASSWORD }}
        run: |
          if [ -z "$AIB_KEYSTORE_BASE64" ]; then echo "no private key configured: signing with the committed debug.keystore"; exit 0; fi
          # half-configured secrets would quietly fall back to the public key, so stop instead
          for V in AIB_KEYSTORE_PASSWORD AIB_KEY_ALIAS AIB_KEY_PASSWORD; do
            [ -n "${!V}" ] || { echo "::error::secret $V is missing (needed with AIB_KEYSTORE_BASE64)"; exit 1; }; done
          printf '%s' "$AIB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aib.keystore"
          { echo "AIB_KEYSTORE_FILE=$RUNNER_TEMP/aib.keystore"
            echo "AIB_KEYSTORE_PASSWORD=$AIB_KEYSTORE_PASSWORD"
            echo "AIB_KEY_ALIAS=$AIB_KEY_ALIAS"
            echo "AIB_KEY_PASSWORD=$AIB_KEY_PASSWORD"; } >> "$GITHUB_ENV"
          echo "signing with the private key from secrets"
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.10.2' }
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -Pvc=${{ github.run_number }}
      - name: Stage APK (outside the workspace; its path contains '..')
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/ai-browser-debug.apk"
          ls -la "$RUNNER_TEMP/apk"
      # the release job downloads this, so a failed upload must fail the build
      - uses: actions/upload-artifact@v6
        with:
          name: ai-browser-debug-apk
          path: ${{ runner.temp }}/apk/ai-browser-debug.apk

  # pushes only check that the app builds; the phone download is updated only when Basil asks
  # (Actions -> Build Android APK -> Run workflow)
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ai-browser-debug-apk
          path: ${{ runner.temp }}/apk
      - name: Publish APK as a release (direct download from the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$RUNNER_TEMP/apk/ai-browser-debug.apk"
          REPO="$GITHUB_REPOSITORY"
          TITLE="AI Browser (debug APK)"
          NOTES="Debug build 0.1.${{ github.run_number }} for Android. Install and allow unknown sources."
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            # replace the APK without ever leaving the release empty: upload under a temporary name first,
            # then drop the old file and rename the new one (if the upload fails, the old APK is still there)
            cp "$APK" "$RUNNER_TEMP/apk/ai-browser-debug.new.apk"
            gh release upload latest "$RUNNER_TEMP/apk/ai-browser-debug.new.apk" --clobber --repo "$REPO"
            ASSETS=$(gh api "repos/$REPO/releases/tags/latest" --jq '.assets[] | "\(.id) \(.name)"')
            NEW=$(echo "$ASSETS" | awk '$2=="ai-browser-debug.new.apk" {print $1}')
            OLD=$(echo "$ASSETS" | awk '$2=="ai-browser-debug.apk" {print $1}')
            test -n "$NEW"
            if [ -n "$OLD" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$OLD"; fi
            gh api -X PATCH "repos/$REPO/releases/assets/$NEW" -f name=ai-browser-debug.apk >/dev/null
            gh release edit latest --repo "$REPO" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create latest "$APK" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "$TITLE" --notes "$NOTES" --prerelease
          fi
