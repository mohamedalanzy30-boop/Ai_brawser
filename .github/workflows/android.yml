name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true only when the owner added his own signing key as repository secrets (see README); otherwise the
      # committed debug.keystore signs the APK as before. Secrets cannot be tested directly in a step's `if`.
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_STORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Fetch ONNX Runtime Web + model into app assets
        env:
          # the SR model is fetched from this Hugging Face revision; a commit sha (instead of main) plus its sha256
          # makes the build reproducible. Every run writes the commit and sha256 it got into the job summary, so
          # pinning is copying those two values here. With SR_MODEL_SHA256 set, a different file fails the build.
          SR_MODEL_REV: main
          SR_MODEL_SHA256: ''
        run: |
          set -e
          cd android/app/src/main/assets
          mkdir -p ort model
          npm pack onnxruntime-web@1.31.1 --silent
          tar -xzf onnxruntime-web-*.tgz package/dist
          cp package/dist/ort.webgpu.min.js ort/
          # the WebGPU bundle only loads the asyncify build; the other three variants were 60 MB of dead weight
          cp package/dist/ort-wasm-simd-threaded.asyncify.mjs package/dist/ort-wasm-simd-threaded.asyncify.wasm ort/
          rm -rf package onnxruntime-web-*.tgz
          curl -fL -D "$RUNNER_TEMP/model.headers" -o model/realesr-general-x4v3.onnx \
            "https://huggingface.co/CoderViking/realesr-general-x4v3-onnx/resolve/$SR_MODEL_REV/realesr-general-x4v3.onnx"
          MODEL_COMMIT=$(grep -i '^x-repo-commit:' "$RUNNER_TEMP/model.headers" | head -1 | awk '{print $2}' | tr -d '\r')
          MODEL_SHA=$(sha256sum model/realesr-general-x4v3.onnx | cut -d' ' -f1)
          echo "SR model: revision \`$SR_MODEL_REV\`, Hugging Face commit \`${MODEL_COMMIT:-unknown}\`, sha256 \`$MODEL_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SR_MODEL_SHA256" ] && [ "$MODEL_SHA" != "$SR_MODEL_SHA256" ]; then
            echo "::error::SR model sha256 $MODEL_SHA does not match the pinned $SR_MODEL_SHA256"; exit 1; fi
          # fixed-size copies of the SR model for the NPU (native player), one per source class (360p..660p);
          # each takes the video at its own size and returns 2560x1440 (the NPU scales the 4x result to the screen)
          pip install --quiet --only-binary=:all: onnx pillow
          SIZES="640x360 854x480 960x540 1174x660"
          for S in $SIZES; do W=${S%x*}; H=${S#*x}
            python3 "$GITHUB_WORKSPACE/tools/fix_model.py" model/realesr-general-x4v3.onnx model/realesr-x4v3-$S.onnx $H $W 1440 2560; done
          # A16W8 quantized copies for the NPU, calibrated on real video frames (Big Buck Bunny, CC-BY Blender Foundation; first mirror that answers).
          # Optional: if anything here fails the app simply uses the float models.
          ( pip install --quiet --only-binary=:all: onnxruntime==1.29.0 imageio-ffmpeg &&  # 1.29 has the calibration cache quantize_qnn.py uses
            FFMPEG=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") &&
            for SRC in https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4 \
                       https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_5MB.mp4 \
                       https://download.blender.org/peach/bigbuckbunny_movies/big_buck_bunny_480p_h264.mov; do
              "$FFMPEG" -loglevel error -y -i "$SRC" -t 600 \
                -vf "select='not(mod(n\,10))',scale=640:360:flags=bicubic" -fps_mode vfr -frames:v 24 -f rawvideo -pix_fmt rgb24 "$RUNNER_TEMP/calib.rgb" \
                && [ -s "$RUNNER_TEMP/calib.rgb" ] && echo "calibration frames from $SRC" && break
            done && [ -s "$RUNNER_TEMP/calib.rgb" ] &&
            for S in $SIZES; do
              python3 "$GITHUB_WORKSPACE/tools/quantize_qnn.py" model/realesr-x4v3-$S.onnx "$RUNNER_TEMP/calib.rgb" model/realesr-x4v3-$S-a16w8.onnx 640x360 || exit 1; done &&
            rm -f model/*.pre.onnx &&
            echo "A16W8 quantized NPU models: built" >> "$GITHUB_STEP_SUMMARY" ) ||
            { echo "::warning::quantized models skipped"; rm -f model/*-a16w8.onnx model/*.pre.onnx
              echo "**A16W8 quantized NPU models: skipped** (calibration or quantization failed; this APK uses the fp16 NPU models)" >> "$GITHUB_STEP_SUMMARY"; }
          # ad/tracker host list (StevenBlack/hosts, MIT), bundled so blocking needs no network at runtime
          # + HaGeZi Pro (GPL-3.0): covers the pop-under / redirect ad networks used by movie sites
          # the block lists are deliberately NOT pinned: each build should ship the freshest lists (new ad domains
          # appear daily), so two builds of the same commit may differ here
          { curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts \
              | awk '$1=="0.0.0.0" && $2!="0.0.0.0" {print tolower($2)}'
            curl -fsSL https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt \
              | grep -v '^#' | tr 'A-Z' 'a-z'; } | grep -E '^[a-z0-9.-]+$' | sort -u > adhosts.txt
          test "$(wc -l < adhosts.txt)" -gt 10000
          # optional adult-content filter (off by default in the app): HaGeZi NSFW (GPL-3.0)
          curl -fsSL https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nsfw-onlydomains.txt \
            | grep -v '^#' | tr 'A-Z' 'a-z' | grep -E '^[a-z0-9.-]+$' | sort -u > adulthosts.txt \
            || { echo "::warning::adult list skipped"; : > adulthosts.txt; }
          ls -la ort model adhosts.txt adulthosts.txt
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.10.2' }
      - name: Signing key from secrets (skipped unless SIGNING_STORE_B64 exists)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_STORE_B64: ${{ secrets.SIGNING_STORE_B64 }}
        run: |
          echo "$SIGNING_STORE_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
          echo "APK signed with the owner's key from the SIGNING_* secrets" >> "$GITHUB_STEP_SUMMARY"
      - name: Build debug APK
        working-directory: android
        env:
          # read by app/build.gradle.kts only when SIGNING_STORE_FILE was set by the step above
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug -Pvc=${{ github.run_number }}
      - name: Remove decoded signing key
        if: always() && env.HAS_SIGNING_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/signing.jks"
      - name: Stage APK (outside the workspace; its path contains '..')
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/ai-browser-debug.apk"
          ls -la "$RUNNER_TEMP/apk"
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: ai-browser-debug-apk
          path: ${{ runner.temp }}/apk/ai-browser-debug.apk
      # pushes only check that the app builds; the phone download is updated only when Basil asks
      # (Actions -> Build Android APK -> Run workflow)
      - name: Publish APK as a release (direct download from the phone)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release is never deleted, so the phone's download link keeps working during the update:
          # first run creates it; later runs move the tag to this commit and replace the APK in place
          NOTES="Debug build for Android (commit $GITHUB_SHA, run ${{ github.run_number }}). Install and allow unknown sources."
          if gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload latest "$RUNNER_TEMP/apk/ai-browser-debug.apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create latest "$RUNNER_TEMP/apk/ai-browser-debug.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "AI Browser (debug APK)" --notes "$NOTES" --prerelease
          fi
