name: UI screenshots
# Builds the app without the AI model and photographs the browser UI on an emulator (English + Arabic RTL).
# Runs only on claude/* work branches; never publishes anything.
on:
  push:
    branches: ['claude/**']
    paths: ['android/**', 'tools/ui_shots.py', '.github/workflows/ui-shots.yml']
concurrency:
  group: ui-shots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: ONNX Runtime Web (the page engine needs it at start; the model is not needed for the UI)
        run: |
          cd android/app/src/main/assets
          mkdir -p ort
          npm pack onnxruntime-web@1.31.1 --silent
          tar -xzf onnxruntime-web-*.tgz package/dist
          cp package/dist/ort.webgpu.min.js package/dist/ort-wasm-simd-threaded.asyncify.mjs package/dist/ort-wasm-simd-threaded.asyncify.wasm ort/
          rm -rf package onnxruntime-web-*.tgz
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: false
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            python3 tools/ui_shots.py "$RUNNER_TEMP/shots" en
            adb shell cmd locale set-app-locales com.aib.browser --locales ar-SA
            python3 tools/ui_shots.py "$RUNNER_TEMP/shots" ar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ${{ runner.temp }}/shots
